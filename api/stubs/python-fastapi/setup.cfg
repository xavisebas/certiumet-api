[metadata]
name = certiumet_stubs
version = 1.0.0
description = Contrato de la API de pedidos y verificación de certificados académicos de la Secretaría. Cada endpoint corresponde a una historia de usuario (HU-01 a HU-05) del documento docs/07-historias-y-criterios.md. El contrato no expone datos personales sensibles: el estudiante se identifica por su token y no por su cédula (restricción R1).
long_description = file: README.md
keywords = OpenAPI API CertiUMET
python_requires = >= 3.10.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
install_requires = fastapi[all]
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
